[project]
name = "csbs-harm-discordance"
version = "1.0.0"
description = "Reproducibility code for the CSBS harm-discordance analysis"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy==2.0.2",
    "pandas==2.3.3",
    "scipy==1.13.1",
    "statsmodels==0.14.6",
    "patsy==1.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
